name: Xcode - Build, Test and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, test and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          default=$(xcodebuild -list -json | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['schemes'][0]")
          echo "scheme=$default" >> "$GITHUB_ENV"
          echo "Using default scheme: $default"
      - name: Build and analyze
        run: |
          set -o pipefail
          if [ -n "$(ls -A | grep -i '\.xcworkspace$')" ]; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$')
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$')
          fi
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          echo "filetype_parameter=$filetype_parameter" >> "$GITHUB_ENV"
          echo "file_to_build=$file_to_build" >> "$GITHUB_ENV"
          xcodebuild clean build analyze -scheme "$scheme" -"$filetype_parameter" "$file_to_build" | xcpretty
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination 'platform=macOS' -configuration Debug | xcpretty
