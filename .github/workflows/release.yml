name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect scheme
        run: |
          default=$(xcodebuild -list -json | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['schemes'][0]")
          if [ -z "$default" ]; then
            echo "::error::No Xcode scheme detected."
            exit 1
          fi
          echo "scheme=$default" >> "$GITHUB_ENV"
          echo "Using scheme: $default"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project voltapeak.xcodeproj \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/voltapeak.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual | xcpretty

      - name: Package .app into zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build/voltapeak.xcarchive/Products/Applications
          ditto -c -k --keepParent voltapeak.app "$GITHUB_WORKSPACE/voltapeak-${TAG}.zip"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ASSET=voltapeak-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "voltapeak $TAG" \
            --generate-notes \
            "$ASSET"
